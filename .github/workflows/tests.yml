name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC: slow tests too
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest supported
            python: "3.9"
            deps: "numpy==1.22.* scipy==1.8.* matplotlib==3.5.*"
          - name: latest
            python: "3.13"
            deps: "numpy scipy matplotlib"
    name: ${{ matrix.name }} (Python ${{ matrix.python }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ${{ matrix.deps }} pytest
          python -m pip install -e . --no-deps
      - name: Fast tests
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: python -m pytest -m "not slow"
      - name: All tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m pytest
